[package]
name = "ieee802154-sniffer-microbit"
version = "0.1.0"
edition = "2021"
authors = [ "Erik Bånvik <erik.public@gmail.com>" ]
license = "MIT"

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1.0"
defmt-rtt = "1.1"
embassy-executor = { version = "0.9", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-futures = { version = "0.1" }
embassy-nrf = {version = "0.8", features =  ["defmt", "nrf52833", "time-driver-rtc1", "time"]}
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.7", features = ["defmt"] }
panic-probe = { version = "1.0", features = ["print-defmt"] }
rand = { version = "0.9", default-features = false }
ieee802154-sniffer-wire-format = { path = "../wire-format", features = ["defmt"] }

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = "s"
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = "s"
overflow-checks = false
