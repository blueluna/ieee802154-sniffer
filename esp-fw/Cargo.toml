[package]
name = "ieee802154-sniffer-esp32-c6"
version = "0.1.0"
authors = ["Erik Bånvik <erik.public@gmail.com>"]
edition = "2024"
license = "MIT"

[dependencies]
esp-hal = { version = "~1.0", features = ["defmt", "esp32c6", "unstable"] }
esp-radio = { version = "0.17", features = ["esp32c6", "unstable", "ieee802154"] }
esp-rtos = { version = "0.2.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp32c6",
] }

defmt                  = "1.0"
esp-bootloader-esp-idf = { version = "0.4.0", features = ["defmt", "esp32c6"] }

embassy-executor = { version = "0.9.1", features = ["defmt"] }
embassy-time     = { version = "0.5.0", features = ["defmt"] }
esp-alloc        = { version = "0.9.0", features = ["defmt"] }
panic-rtt-target = { version = "0.2.0", features = ["defmt"] }
rtt-target       = { version = "0.6.2", features = ["defmt"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"

defmt-rtt = "1.1"
embassy-futures = "0.1.1"
embassy-sync = { version = "0.7", features = ["defmt"] }
embedded-io-async = "0.7"
ieee802154-sniffer-wire-format = { path = "../wire-format", features = ["defmt"] }

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 2
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false
